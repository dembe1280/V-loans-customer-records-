<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>V-Loans Records</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
}
.container {
  background: white;
  max-width: 1000px;
  margin: 20px auto;
  padding: 20px;
  border-radius: 10px;
}
input, select, button {
  padding: 7px;
  margin: 4px;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}
th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}
th {
  background: #003366;
  color: white;
}
.overdue {
  background: #ffcccc;
}
.paid {
  color: green;
  font-weight: bold;
}
.unpaid {
  color: orange;
  font-weight: bold;
}
.hidden {
  display: none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginBox">
  <h2>🔐 Admin Login</h2>
  <input type="password" id="password" placeholder="Enter password">
  <button onclick="login()">Login</button>
</div>

<!-- ADMIN -->
<div class="container hidden" id="adminBox">

<h2>📊 Student Loan Records</h2>

<input id="name" placeholder="Student Name">
<input id="amount" type="number" placeholder="Amount (R100 - R5000)">
<select id="period">
  <option value="7">7 days</option>
  <option value="14">14 days</option>
  <option value="30">30 days</option>
</select>
<select id="gadget">
  <option>Laptop</option>
  <option>Smartphone</option>
  <option>Tablet</option>
  <option>Gaming Console</option>
</select>

<button onclick="addLoan()">Add Loan</button>
<button onclick="exportCSV()">Export Excel</button>

<h3 id="profit">Total Profit: R0</h3>

<table>
<thead>
<tr>
<th>Date</th>
<th>Name</th>
<th>Amount</th>
<th>Repayment</th>
<th>Period</th>
<th>Final Day</th>
<th>Gadget</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

</div>

<script>
const ADMIN_PASSWORD = "admin123";
let loans = JSON.parse(localStorage.getItem("loans")) || [];

function login() {
  if (document.getElementById("password").value === ADMIN_PASSWORD) {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("adminBox").classList.remove("hidden");
    draw();
  } else {
    alert("Wrong password");
  }
}

function addLoan() {
  let name = document.getElementById("name").value;
  let amount = Number(document.getElementById("amount").value);
  let period = Number(document.getElementById("period").value);
  let gadget = document.getElementById("gadget").value;

  if (!name || amount < 100 || amount > 5000) {
    alert("Enter valid details");
    return;
  }

  let today = new Date();
  let finalDay = new Date();
  finalDay.setDate(today.getDate() + period);

  loans.push({
    date: today.toLocaleDateString(),
    name,
    amount,
    repayment: (amount * 1.3).toFixed(2),
    period,
    finalDay: finalDay.toLocaleDateString(),
    finalTime: finalDay.getTime(),
    gadget,
    status: "Not Paid"
  });

  localStorage.setItem("loans", JSON.stringify(loans));
  draw();
}

function draw() {
  let html = "";
  let profit = 0;
  let now = new Date().getTime();

  loans.forEach((l, i) => {
    if (l.status !== "Paid" && now > l.finalTime) {
      l.status = "Overdue";
    }
    if (l.status === "Paid") {
      profit += (l.repayment - l.amount);
    }

    html += `
    <tr class="${l.status === 'Overdue' ? 'overdue' : ''}">
      <td>${l.date}</td>
      <td>${l.name}</td>
      <td>R${l.amount}</td>
      <td>R${l.repayment}</td>
      <td>${l.period} days</td>
      <td>${l.finalDay}</td>
      <td>${l.gadget}</td>
      <td class="${l.status === 'Paid' ? 'paid' : 'unpaid'}">${l.status}</td>
      <td>
        <button onclick="markPaid(${i})">Paid</button>
        <button onclick="removeLoan(${i})">Delete</button>
      </td>
    </tr>`;
  });

  document.getElementById("rows").innerHTML = html;
  document.getElementById("profit").innerText = "Total Profit: R" + profit.toFixed(2);
  localStorage.setItem("loans", JSON.stringify(loans));
}

function markPaid(i) {
  loans[i].status = "Paid";
  draw();
}

function removeLoan(i) {
  if (confirm("Delete record?")) {
    loans.splice(i, 1);
    draw();
  }
}

function exportCSV() {
  let csv = "Date,Name,Amount,Repayment,Period,Final Day,Gadget,Status\n";
  loans.forEach(l => {
    csv += `${l.date},${l.name},${l.amount},${l.repayment},${l.period},${l.finalDay},${l.gadget},${l.status}\n`;
  });

  let blob = new Blob([csv], { type: "text/csv" });
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "loan-records.csv";
  a.click();
}
</script>

</body>
</html>
