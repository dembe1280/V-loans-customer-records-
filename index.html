<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>V-Loans Records</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background:#f2f2f2;
}
.container {
  background:white;
  max-width:1100px;
  margin:20px auto;
  padding:20px;
  border-radius:10px;
}
input, select, button {
  padding:7px;
  margin:4px;
}
button {
  cursor:pointer;
}
table {
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th, td {
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
}
th {
  background:#003366;
  color:white;
}
.overdue {
  background:#ffcccc;
}
.hidden {
  display:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginBox">
  <h2>🔐 Admin Login</h2>
  <input id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <br>
  <button onclick="login()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div class="container hidden" id="adminBox">

<h2>📊 Student Loan Records</h2>
<p><strong>Logged in as:</strong> <span id="loggedUser"></span></p>

<input id="name" placeholder="Student Name">
<input id="phone" placeholder="Customer Phone (27XXXXXXXXX)">
<input id="amount" type="number" placeholder="Amount (R100 - R5000)">

<select id="period">
  <option value="7">7 days</option>
  <option value="14">14 days</option>
  <option value="30">30 days</option>
</select>

<select id="gadget">
  <option>Laptop</option>
  <option>Smartphone</option>
  <option>Tablet</option>
  <option>Gaming Console</option>
</select>

<br>
<button onclick="addLoan()">➕ Add Loan</button>
<button onclick="exportCSV()">📤 Export Excel</button>
<button onclick="logout()">🚪 Logout</button>

<h3 id="profit">Total Profit: R0.00</h3>

<table>
<thead>
<tr>
<th>Receipt</th>
<th>Date</th>
<th>Name</th>
<th>Phone</th>
<th>Amount</th>
<th>Repayment</th>
<th>Final Day</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

</div>

<script>
// USERS
const users = [
  { username: "admin", password: "admin123" },
  { username: "manager", password: "manager123" },
  { username: "staff", password: "staff123" }
];

let loans = JSON.parse(localStorage.getItem("loans")) || [];
let currentUser = null;

// LOGIN
function login() {
  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;

  const found = users.find(user => user.username === u && user.password === p);
  if (!found) {
    alert("Invalid login");
    return;
  }

  currentUser = u;
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminBox").classList.remove("hidden");
  document.getElementById("loggedUser").innerText = u;

  draw();
}

// LOGOUT
function logout() {
  document.getElementById("adminBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
}

// RECEIPT
function generateReceipt() {
  return "VL-" + Date.now();
}

// ADD LOAN (FIXED)
function addLoan() {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const amount = Number(document.getElementById("amount").value);
  const period = Number(document.getElementById("period").value);

  if (!name || !phone || amount < 100 || amount > 5000) {
    alert("Please enter valid details");
    return;
  }

  const today = new Date();
  const finalDay = new Date();
  finalDay.setDate(today.getDate() + period);

  loans.push({
    receipt: generateReceipt(),
    date: today.toLocaleDateString(),
    name,
    phone,
    amount,
    repayment: (amount * 1.3).toFixed(2),
    finalDay: finalDay.toLocaleDateString(),
    finalTime: finalDay.getTime(),
    status: "Not Paid",
    addedBy: currentUser
  });

  localStorage.setItem("loans", JSON.stringify(loans));

  document.getElementById("name").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("amount").value = "";

  draw();
}

// DRAW TABLE
function draw() {
  let html = "";
  let profit = 0;
  const now = Date.now();

  loans.forEach((l, i) => {
    if (l.status !== "Paid" && now > l.finalTime) {
      l.status = "Overdue";
    }

    if (l.status === "Paid") {
      profit += (l.repayment - l.amount);
    }

    html += `
    <tr class="${l.status === 'Overdue' ? 'overdue' : ''}">
      <td>${l.receipt}</td>
      <td>${l.date}</td>
      <td>${l.name}</td>
      <td>${l.phone}</td>
      <td>R${l.amount}</td>
      <td>R${l.repayment}</td>
      <td>${l.finalDay}</td>
      <td>${l.status}</td>
      <td>
        <button onclick="markPaid(${i})">Paid</button>
        <button onclick="sendWhatsApp(${i})">WhatsApp</button>
        <button onclick="removeLoan(${i})">Delete</button>
      </td>
    </tr>`;
  });

  document.getElementById("rows").innerHTML = html;
  document.getElementById("profit").innerText = "Total Profit: R" + profit.toFixed(2);
  localStorage.setItem("loans", JSON.stringify(loans));
}

// MARK PAID
function markPaid(i) {
  loans[i].status = "Paid";
  draw();
}

// DELETE
function removeLoan(i) {
  if (confirm("Delete this record?")) {
    loans.splice(i, 1);
    draw();
  }
}

// WHATSAPP
function sendWhatsApp(i) {
  const l = loans[i];

  if (l.status !== "Overdue") {
    alert("WhatsApp reminders are for overdue loans only.");
    return;
  }

  const msg =
    "Hello " + l.name +
    "%0AYour loan is OVERDUE." +
    "%0AAmount to repay: R" + l.repayment +
    "%0AFinal payment date was: " + l.finalDay +
    "%0APlease settle immediately.";

  window.open("https://wa.me/" + l.phone + "?text=" + msg, "_blank");
}

// EXPORT CSV
function exportCSV() {
  let csv = "Receipt,Name,Phone,Amount,Repayment,Final Day,Status\n";
  loans.forEach(l => {
    csv += `${l.receipt},${l.name},${l.phone},${l.amount},${l.repayment},${l.finalDay},${l.status}\n`;
  });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "loan-records.csv";
  a.click();
}
</script>

</body>
</html>
